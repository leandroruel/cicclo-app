openapi: 3.0.3
info:
  title: Cicclo API
  version: 1.0.0
  description: |
    HTTP API for the Cicclo laundry app. Monetary values are decimal BRL amounts.
    Authentication is not implemented; wallet and order operations currently use
    the seeded default wallet. List endpoints are not paginated.
servers:
  - url: http://localhost:5000
    description: Local development
tags:
  - name: Wallet
  - name: Services
  - name: Orders
paths:
  /api/v1/wallet:
    get:
      tags: [Wallet]
      operationId: getDefaultWallet
      summary: Get the default wallet
      responses:
        '200':
          description: The default wallet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        '404':
          description: The default wallet was not found.
  /api/v1/wallet/{id}:
    get:
      tags: [Wallet]
      operationId: getWalletById
      summary: Get a wallet by ID
      parameters:
        - $ref: '#/components/parameters/WalletId'
      responses:
        '200':
          description: The requested wallet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        '404':
          description: No wallet matches the identifier.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/wallet/credits:
    post:
      tags: [Wallet]
      operationId: creditDefaultWallet
      summary: Add funds to the default wallet
      description: Repeating a key with the same amount returns the original result without applying the credit again.
      parameters:
        - $ref: '#/components/parameters/CreditIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditWalletRequest'
      responses:
        '200':
          description: Credit applied or safely replayed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        '400':
          description: Missing/invalid idempotency key, amount precision, or request validation error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Idempotency key was already used with a different amount.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/wallet/transactions:
    get:
      tags: [Wallet]
      operationId: listWalletTransactions
      summary: List default wallet transactions
      description: Returns order debit ledger entries from newest to oldest. Credits are stored separately and are not included.
      responses:
        '200':
          description: Wallet transaction history; an empty history returns an empty items array.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletTransactionList'
  /api/v1/services:
    get:
      tags: [Services]
      operationId: listServices
      summary: List active services
      description: Results are ordered by service ID.
      responses:
        '200':
          description: Active services.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceList'
  /api/v1/services/{id}:
    get:
      tags: [Services]
      operationId: getServiceById
      summary: Get an active service by ID
      parameters:
        - name: id
          in: path
          required: true
          description: Service identifier.
          schema:
            type: integer
            format: int32
            minimum: 1
      responses:
        '200':
          description: The active service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '404':
          description: The service does not exist or is inactive.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/orders:
    get:
      tags: [Orders]
      operationId: listOrders
      summary: List order history
      description: Returns confirmed orders from newest to oldest. The list is not paginated.
      responses:
        '200':
          description: Order history; an empty history returns an empty items array.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderList'
    post:
      tags: [Orders]
      operationId: createOrder
      summary: Request a service
      description: Debits the default wallet and creates the order and ledger entry atomically.
      parameters:
        - $ref: '#/components/parameters/OrderIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created.
          headers:
            Location:
              description: URL of the created order.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '200':
          description: Idempotent replay of the original order.
          headers:
            Idempotent-Replayed:
              description: Indicates that this response is a replay.
              schema:
                type: string
                enum: ['true']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Missing or invalid idempotency key, or invalid request body.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Service does not exist or is inactive.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Transient wallet concurrency conflict.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Insufficient wallet balance or idempotency key reused for another service.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/orders/{id}:
    get:
      tags: [Orders]
      operationId: getOrderById
      summary: Get an order by ID
      parameters:
        - name: id
          in: path
          required: true
          description: Order UUID.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The requested order, including its wallet balance after the purchase.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order was not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  parameters:
    WalletId:
      name: id
      in: path
      required: true
      description: Wallet UUID.
      schema:
        type: string
        format: uuid
    CreditIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Non-empty idempotency key of at most 128 characters, reused on retries.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    OrderIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID generated for this purchase intent and reused on retries.
      schema:
        type: string
        format: uuid
  schemas:
    Wallet:
      type: object
      required: [id, balance, currency]
      properties:
        id:
          type: string
          format: uuid
        balance:
          type: number
          example: 50.00
        currency:
          type: string
          enum: [BRL]
    CreditWalletRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
          exclusiveMinimum: 0
          maximum: 9999999999999999.99
          multipleOf: 0.01
          example: 50.00
    WalletTransactionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WalletTransaction'
    WalletTransaction:
      type: object
      required: [id, type, amount, balanceAfter, orderId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [Debit]
        amount:
          type: number
          example: 18.90
        balanceAfter:
          type: number
          example: 31.10
        orderId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
    ServiceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Service'
    Service:
      type: object
      required: [id, name, price, currency]
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        price:
          type: number
          example: 18.90
        currency:
          type: string
          enum: [BRL]
    CreateOrderRequest:
      type: object
      required: [serviceId]
      properties:
        serviceId:
          type: integer
          format: int32
          minimum: 1
    OrderList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderListItem'
    OrderListItem:
      type: object
      required: [id, serviceId, serviceName, price, currency, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        serviceId:
          type: integer
          format: int32
        serviceName:
          type: string
        price:
          type: number
          example: 18.90
        currency:
          type: string
          enum: [BRL]
        status:
          type: string
          enum: [Confirmed]
        createdAt:
          type: string
          format: date-time
    Order:
      allOf:
        - $ref: '#/components/schemas/OrderListItem'
        - type: object
          required: [walletBalance]
          properties:
            walletBalance:
              type: number
              example: 31.10
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Stable application error code when provided.
        balance:
          type: number
        required:
          type: number
